version = 0.1

[dev.global.parameters]
stack_name = "keno4min-draw-engine-dev"
region = "us-east-1"

[dev.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
parameter_overrides = "DynamoDBTableName=cronos-dev-keno4min ScheduleState=ENABLED"

[prod.global.parameters]
stack_name = "keno4min-draw-engine-prod"
region = "us-east-1"

[prod.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
parameter_overrides = "DynamoDBTableName=cronos-prod-keno4min ScheduleState=ENABLED"
