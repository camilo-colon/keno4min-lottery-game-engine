AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Keno4min Draw Engine - creacion de sorteos con DynamoDB

Parameters:
  DynamoDBTableName:
    Type: String
    Default: cronos-dev-keno4min
    Description: Nombre de la tabla DynamoDB existente (PK y SK de tipo String)

  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues:
      - ENABLED
      - DISABLED
    Description: Habilita o deshabilita la ejecucion automatica del workflow

Resources:
  CreateDrawFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: functions/create-draw/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 15
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref DynamoDBTableName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}

  GameWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: statemachine/game-workflow.asl.json
      DefinitionSubstitutions:
        CreateDrawFunctionArn: !GetAtt CreateDrawFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref CreateDrawFunction
      Events:
        EveryThreeMinutes:
          Type: ScheduleV2
          Properties:
            Description: Inicia el flujo cada 3 minutos
            ScheduleExpression: rate(3 minutes)
            FlexibleTimeWindow:
              Mode: 'OFF'
            State: !Ref ScheduleState
            OmitName: true
            Input: '{"requestId":"<aws.scheduler.schedule-arn>#<aws.scheduler.scheduled-time>"}'

Outputs:
  GameWorkflowArn:
    Description: ARN de la Step Function
    Value: !Ref GameWorkflow
  CreateDrawFunctionArn:
    Description: ARN de la Lambda create-draw
    Value: !GetAtt CreateDrawFunction.Arn
